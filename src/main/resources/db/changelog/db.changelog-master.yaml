databaseChangeLog:
  - changeSet:
      id: 001-create-bank-account
      author: guillaume
      changes:
        - createTable:
            tableName: bank_account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: initial_balance
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: creation_date
                  type: DATETIME
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-bank-transaction
      author: guillaume
      changes:
        - createTable:
            tableName: bank_transaction
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: transaction_details
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_date
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: bank_account_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: bank_transaction
            baseColumnNames: bank_account_id
            referencedTableName: bank_account
            referencedColumnNames: id
            constraintName: fk_bank_transaction_bank_account