databaseChangeLog:
  - changeSet:
      id: 001-create-bank-account
      author: guillaume
      changes:
        - createTable:
            tableName: bank_account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: initial_balance
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: creation_date
                  type: DATETIME
                  constraints:
                    nullable: false